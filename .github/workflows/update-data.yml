name: Actualizar datos meteorológicos

# El cron interno se mantiene como respaldo; el disparador principal puede ser externo
# mediante workflow_dispatch. GitHub Actions cron usa UTC.

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-datos-meteorologicos
  cancel-in-progress: true

jobs:
  update-data:
    name: Generar y guardar datos_playas.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      AEMET_OPENDATA_AREA: esp
      # El balanceador de la Junta fallaba con el ClientHello TLS 1.3 de Node 24.
      # build-data.mjs usa TLS 1.2 para esa fuente; aquí solo se fijan los márgenes.
      JUNTA_TIMEOUT_MS: "10000"
      JUNTA_BUDGET_MS: "180000"
      # Instrumentación científica: dos snapshots durante una hora de cada tres.
      # No afecta a datos_playas.json ni al baremo.
      WIND_VALIDATION_CADENCE_HOURS: "3"
      WIND_VALIDATION_LEADS: "1,6,12,24"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sincronizar con main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Validar secret AEMET
        run: |
          if [ -z "$AEMET_API_KEY" ]; then
            echo "::error::Falta el secret AEMET_API_KEY en este repositorio"
            exit 1
          fi
          echo "AEMET_API_KEY configurada"

      - name: Comprobar sintaxis y pruebas
        run: |
          node --check build-data.mjs
          node --check validar-rachas.mjs
          node --check analizar-rachas.mjs
          node --test

      - name: Generar datos meteorológicos
        run: node build-data.mjs

      - name: Validar JSON generado
        run: |
          test -f datos_playas.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('datos_playas.json','utf8');
          const json = JSON.parse(raw);
          console.log('JSON OK');
          console.log('generated_at:', json.generated_at || json.updated_at || '(sin fecha)');
          console.log('aemet ok:', json.aemet_alerts && json.aemet_alerts.ok);
          const leaks = {
            jwt: /eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/.test(raw),
            api_key_value: /api[_-]?key["']?\s*[:=]\s*["']?(?!\[redacted\])[A-Za-z0-9._-]{12,}/i.test(raw)
          };
          console.log('security:', leaks);
          const aemetOk = !!(json.aemet_alerts && json.aemet_alerts.ok);
          if (!aemetOk) console.log('::warning::AEMET no disponible en esta ejecución; se publican los avisos cacheados.');
          if (leaks.jwt || leaks.api_key_value) {
            console.error('Se ha detectado posible contenido sensible en datos_playas.json');
            process.exit(1);
          }
          NODE

      - name: Registrar previsiones y observaciones de viento (no crítico)
        continue-on-error: true
        run: node validar-rachas.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add datos_playas.json
          git add viento_validacion_v2_*.jsonl 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No hay cambios que commitear"
            exit 0
          fi

          git commit -m "Actualizar datos meteorológicos"

          if ! git push origin main; then
            echo "Push rechazado; sincronizando y regenerando datos..."
            git fetch origin main
            git reset --hard origin/main
            node build-data.mjs
            node validar-rachas.mjs || true
            git add datos_playas.json
            git add viento_validacion_v2_*.jsonl 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No hay cambios tras sincronizar"
              exit 0
            fi
            git commit -m "Actualizar datos meteorológicos"
            git push origin main
          fi

      - name: Ping a healthchecks.io (opcional)
        if: ${{ always() }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "Sin HEALTHCHECK_URL configurada; paso omitido."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" >/dev/null || true
            echo "Ping de éxito enviado."
          else
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/fail" >/dev/null || true
            echo "Ping de fallo enviado."
          fi
